spring:
  application:
    name: dangcharge_Consumer
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/dangcharge}
  data:
    mongodb:
      # 문서 클래스의 인덱스(@Indexed, @CompoundIndex 등)를 기동할 때 만든다
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
      representation:
        # 좌표·출력(kW)을 문자열이 아니라 숫자(Decimal128)로 저장해 범위 조회와 소수 자릿수를 지킨다
        big-decimal: decimal128
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:dangcharge-consumer}
      # 처음 붙는 그룹은 토픽 처음부터 읽어 조회용 데이터를 채운다
      auto-offset-reset: earliest

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

dangcharge:
  jwt:
    # producer가 발급한 토큰을 검증할 RSA 공개키(PEM 또는 Base64). 비어 있으면 모든 토큰을 거절한다
    public-key: ${JWT_PUBLIC_KEY:}
